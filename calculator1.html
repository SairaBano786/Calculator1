<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- HTML Structure -->
    <h2>Calculator</h2>
    
    <input type="number" id="num1" placeholder="Enter first number"><br><br>
    <input type="number" id="num2" placeholder="Enter second number"><br><br>

    <!-- Buttons jin par click karne se JS function chalega -->
    <button onclick="calculate('+')">+</button>
    <button onclick="calculate('-')">-</button>
    <button onclick="calculate('*')">*</button>
    <button onclick="calculate('/')">/</button>

    <h3 id="result">Result:</h3>

    <!-- JavaScript Code Yahan Aayega -->
    <script>
        function calculate(value) {
            let num1 = Number(document.getElementById('num1').value);
            let num2 = Number(document.getElementById('num2').value);
            let result = 0;
            

           
            

            if (value == '+') {
                result = num1 + num2;
            } else if (value == '-') {
                result = num1 - num2;
            } else if (value == '*') {
                result = num1 * num2;
            } else if (value == '/') {
                result = num1 / num2;
            }

           document.getElementById('result').innerHTML='Result:' + result;
        }
          </script>
</body>
</html>
